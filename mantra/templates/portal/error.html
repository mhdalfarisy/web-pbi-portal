{% extends "portal/base.html" if current_user else "portal/bare.html" %}
{% from "portal/_ui.html" import icon %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="empty big">
  {{ icon('search') }}
  <h3>{{ code }}</h3>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('portal.home') }}">Back to Home</a>
</div>
{% endblock %}
