{% macro icon(name) -%}
{%- if name == 'check' -%}
<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8-9"/></svg>
{%- else -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'box' %}<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9M7.5 5.2l9 4.6"/>
{%- elif name == 'cart' %}<path d="M2 4h3l2 12h12"/><rect x="9" y="5" width="10" height="8" rx="1"/><path d="M14 5v8"/><circle cx="9" cy="19.5" r="1.6"/><circle cx="18" cy="19.5" r="1.6"/>
{%- elif name == 'calcheck' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5l2 2 4-4"/>
{%- elif name == 'calendar' %}<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
{%- elif name == 'reset' %}<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/>
{%- elif name == 'building' %}<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'list' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>
{%- elif name == 'plant' %}<path d="M3 21h18M5 21V10l5 3V10l5 3V6l4-2v17"/>
{%- elif name == 'warehouse' %}<path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8M7 17h10"/>
{%- elif name == 'flag' %}<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
{%- elif name == 'doc' %}<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
{%- elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
{%- elif name == 'copy' %}<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- endif -%}
</svg>
{%- endif -%}
{%- endmacro %}
